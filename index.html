<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>projeto</title>
  <link rel="icon" type="image/x-icon" href="stealth-masked.ico">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      line-height: 1.6;
      background: #000;
      color: #fff;
      }
    footer {
      background: #333;
      color: white;
      text-align: center;
    }
    header, nav, main, footer {
      padding: 20px;
    }
    header {
      background: #333;
      color: rgb(255, 255, 255);
    }
    header h1 {
      text-align: center;
      margin: 0;
    }
    nav a {
      display: inline-block;
      margin-right: 10px;
      color: #fff;
      background: #0055aa;
      padding: 8px 12px;
      border-radius: 10px;
      text-decoration: none;
        }
    nav a:hover, nav a:focus {
      background: #222;
      transform: translateY(-1px);
      outline: none;
    }
    nav a:focus-visible {
      outline: 3px solid #66aaff;
      outline-offset: 3px;
    }
    form {
      max-width: 500px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
    }
    button {
      background: #0055aa;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:focus, input:focus {
      outline: 2px solid blue;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Site de eliberto</h1>
</header>

<nav>
  <a href="#formulario">Formulário</a>
  <a href="#video">Vídeo</a>
</nav>

<main>

  <section id="formulario">
    <h2>Formulário de Contato</h2>

    <form>
      <label for="nome">Nome</label>
      <input type="text" id="nome" required>

      <label for="email">Email</label>
      <input type="email" id="email" required title="Digite um email válido">

      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" pattern="[0-9]{10,11}" placeholder="Apenas números" required>

      <button type="submit">Enviar</button>
    </form>
  </section>

  <section id="video">
    <h2>Vídeo Acessível</h2>

    <video controls autoplay muted playsinline width="100%" aria-label="Vídeo: Anime Red">
      <source src="Anime Red.mp4" type="video/mp4">
      <source src="Anime Red.webm" type="video/webm">
      <track kind="subtitles" src="legendas.vtt" srclang="pt" label="Português">
      Seu navegador não suporta vídeo.
    </video>
  </section>

</main>

<footer>
  <p>&copy; 2026 - todo direito De <br>eliberto silvestre chacon</p>
</footer>

</body>
</html>
